name: Build and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Checkout deployment repository
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        uses: actions/checkout@v4
        with:
          repository: jmkyj00-collab/dev-hitop
          ref: main
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          path: deployment
      - name: Publish built files
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        run: |
          node scripts/sync-deployment.mjs _site deployment
          cd deployment
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Deploy hitop-dev-source ${GITHUB_SHA}"
            git push origin HEAD:main
          fi
